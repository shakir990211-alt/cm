
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admission Form</title>
</head>
<body>

    <h1>Al-Falah Public High School Sohbat Pur</h1>
    <h2>Student Admission Form</h2>

    <form>

        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter Student Name" required>
        <br><br>

        <label>Father Name:</label><br>
        <input type="text" placeholder="Enter Father Name" required>
        <br><br>

        <label>Home Address:</label><br>
        <textarea placeholder="Enter Home Address" required></textarea>
        <br><br>

        <label>Age:</label><br>
        <input type="number" placeholder="Enter Age" required>
        <br><br>

        <label>CNIC / B-Form Number:</label><br>
        <input type="text" placeholder="Enter CNIC or B-Form">
        <br><br>

        <label>Student Contact Number:</label><br>
        <input type="tel" placeholder="Enter Contact Number" required>
        <br><br>

        <label>Father Contact Number:</label><br>
        <input type="tel" placeholder="Enter Father Contact" required>
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Select Class:</label><br>
        <select required>
            <option value="">Select Class</option>
            <option>Nursery</option>
            <option>KG</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
            <option>Class 5</option>
            <option>Class 6</option>
            <option>Class 7</option>
            <option>Class 8</option>
            <option>Class 9</option>
            <option>Class 10</option>
        </select>
        <br><br>

        <input type="checkbox" required>
        I am not a robot.
        <br><br>

        <button type="submit">Submit Admission Form</button>
        <!-- <button type="reset">Reset Form</button> -->

    </form>

</body>
</html>
